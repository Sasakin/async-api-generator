asyncapi: 3.0.0
id: https://example.com/resource/api/asyncapi.yaml
defaultContentType: application/json
info:
  title: Resource Management API
  version: 0.1.0
  description: Asynchronous resource management communication description
  externalDocs:
    description: Documentation
    url: https://example.com/docs

servers:
  dev:
    title: Kafka DEV
    summary: Kafka DEV
    host: localhost:31441
    protocol: kafka-secure
    protocolVersion: "3.1"
    description: DEV broker secured with scramSha256
    tags:
      - name: env:test-scram
        description: >-
          This environment is meant for running internal tests
      - name: kind:remote
        description: This server is a remote server. Not exposed by the application
      - name: visibility:private
        description: This resource is private and only available to certain users

channels:
  resource-request:
    address: resource.request
    title: Request topic from other services
    summary: Contains requests from other services
    description: (ToDo Description Channel (topic))
    servers:
      - $ref: "#/servers/dev"
    messages:
      create:
        $ref: "#/components/messages/create-ext"
      delete:
        $ref: "#/components/messages/delete-ext"

operations:
  Receive:
    action: receive
    channel:
      $ref: "#/channels/resource-request"
    title: Receive request from other services
    summary: A brief summary of the operation
    description: A longer description of the operation. CommonMark is allowed.

components:
  messageTraits:
    commonHeaders:
      headers:
        type: object
        required:
          - id
          - source
        properties:
          id:
            type: string
            description: Unique message identifier
            format: uuid
          source:
            type: string
            description: Service that sent the request
          correlationid:
            type: string
            description: Request correlation identifier
            format: uuid
          timestamp:
            type: string
            description: Message creation timestamp
            format: date-time
          contenttype:
            type: string
            description: Content type of the message payload
          replyto:
            type: string
            description: Topic to send response to
        additionalProperties: false

  schemas:
    ResourceObject:
      title: Resource Information
      description: Resource Information
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          description: Resource UUID
        objectTypeDetails:
          $ref: "#/components/schemas/ObjectTypeDTO"

    ObjectTypeDTO:
      title: Object Type
      description: Object Type
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - isPublic
        - cores
        - memoryMb
        - storageGb
      properties:
        id:
          type: string
          format: uuid
          description: Object type identifier

    ObjectTypeDto:
      type: object
      nullable: false
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          description: Identifier

  messages:
    create-ext:
      title: Resource Create Request from external service
      summary: Message with task for creating resource from external service
      description: Message description
      traits:
        - $ref: "#/components/messageTraits/commonHeaders"
      payload:
        $ref: "#/components/schemas/ResourceObject"

    delete-ext:
      title: delete
      summary: Task for deleting resource from external service
      description: Task for deleting resource
      traits:
        - $ref: "#/components/messageTraits/commonHeaders"
      payload:
        type: object
        additionalProperties: false
