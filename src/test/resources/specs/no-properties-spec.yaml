asyncapi: 3.0.0
defaultContentType: application/json
info:
  title: Resource Management API
  version: 0.1.0
  description: Asynchronous resource management API

servers:
  dev:
    host: local:31441
    protocol: kafka-secure
    protocolVersion: '3.1'
    description: DEV broker secured with scramSha256
    tags:
      - name: env:test-scram
        description: >-
          This environment is meant for running internal tests
      - name: kind:remote
        description: This server is a remote server. Not exposed by the application
      - name: visibility:private
        description: This resource is private and only available to certain users

channels:
  resource-request:
    address: resource.request
    title: Resource request topic
    summary: Contains resource management requests
    description: (ToDo Description Channel (topic))
    servers:
      - $ref: '#/servers/dev'
    messages:
      createResource:
        $ref: "#/components/messages/createResource"
      createConfig:
        $ref: "#/components/messages/createConfig"
      modifyResource:
        $ref: "#/components/messages/modifyResource"

  resource-response:
    address: resource.response
    title: Resource response topic
    summary: Contains responses from resource management
    description: (ToDo Description)
    servers:
      - $ref: '#/servers/dev'
    messages:
      response:
        $ref: "#/components/messages/response"

operations:
  Receive:
    action: receive
    channel:
      $ref: "#/channels/resource-request"
    title: Resource request received
    summary: A brief summary of the operation
    description: A longer description of the operation. CommonMark is allowed.

  Send:
    action: send
    channel:
      $ref: "#/channels/resource-response"
    title: Resource operation result
    summary: Resource operation result
    description: (Operation description to be completed)

components:
  messageTraits:
    commonHeaders:
      headers:
        type: object
        required:
          - id
          - source
        properties:
          id:
            type: string
            description: Unique message identifier
            format: uuid
          source:
            type: string
            description: Service that sent the request
          correlationid:
            type: string
            description: Request correlation identifier
            format: uuid
          timestamp:
            type: string
            description: Message creation timestamp
            format: date-time
          contenttype:
            type: string
            description: Content type of the message payload
          replyto:
            type: string
            description: Topic to send response to

  schemas:
    ResourceCreate:
      type: object
      properties:
        specification:
          $ref: '#/components/schemas/ResourceSpecification'
      required:
        - specification

    ResourceSpecification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Resource identifier
        name:
          type: string
          description: Resource name
        ipAddress:
          type: string
          description: IP address for the resource
      required:
        - id
        - name
        - ipAddress

    ConfigCreate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Resource identifier
        specification:
          $ref: '#/components/schemas/ConfigSpecification'
      required:
        - id
        - specification

    ConfigSpecification:
      type: object
      properties:
        name:
          type: string
          description: Name of the configuration
        type:
          type: string
          description: Resource status
          enum: [ ACTIVE, INACTIVE, STANDBY ]
        masters:
          type: array
          items:
            type: string
            description: Master server IP address
        nameservers:
          type: array
          items:
            type: string
            description: Nameserver entry
        servers:
          type: array
          items:
            type: string
            description: Address of the local authoritative server
      required:
        - name
        - type

    ModifyResource:
      type: array
      items:
        $ref: '#/components/schemas/ModifyResourceObject'

    ModifyResourceObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Resource identifier
        type:
          type: string
          description: Resource status
          enum: [ ACTIVE, INACTIVE, STANDBY ]
        specification:
          type: array
          items:
            $ref: '#/components/schemas/ResourceConfigSpecification'
      required:
        - id
        - specification

    ResourceConfigSpecification:
      type: object
      properties:
        zoneName:
          type: string
          description: Name of the resource zone where creation/modification occurs
        type:
          type: string
          description: Resource type
          enum: [ USER, SYSTEM, CONFIG ]
        ttl:
          type: integer
          description: Time to live for resource configuration before deletion
        resources:
          type: array
          items:
            type: string
            description: Resource value for update.
      required:
        - zoneName
        - type
        - resources

    SuccessMessage:
      title: successMessage
      type: object
      description: Success response message
      additionalProperties: false
      properties:
        state:
          type: string
          description: Operation status
          enum:
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - FAILED
        resource:
          type: object
          description: Resource DTO
          properties:
            id:
              type: string

    ErrorMessage:
      title: errorMessage
      description: Error message
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          description: Operation status
          enum:
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - FAILED
        error:
          type: object
          description: Resource DTO
          additionalProperties: false
          properties:
            code:
              type: integer
              description: Error code
            message:
              type: string
              description: Error message
            details:
              type: object
              description: Error details. Keys represent the hierarchical address of the JSON key. The value contains the description in the context of this field.

  messages:
    createResource:
      title: createResource
      summary: Message with task for creating resource
      description: Message description
      traits:
        - $ref: "#/components/messageTraits/commonHeaders"
      payload:
        $ref: "#/components/schemas/ResourceCreate"

    createConfig:
      title: createConfig
      summary: Message with task for creating resource configuration
      description: Message description
      traits:
        - $ref: "#/components/messageTraits/commonHeaders"
      payload:
        $ref: "#/components/schemas/ConfigCreate"

    modifyResource:
      title: modifyResource
      summary: Message with task for creating and/or modifying resource
      description: Message description
      traits:
        - $ref: "#/components/messageTraits/commonHeaders"
      payload:
        $ref: "#/components/schemas/ModifyResource"

    response:
      title: response
      summary: Message with the result of resource operation
      description: Message with the result of resource operation
      traits:
        - $ref: "#/components/messageTraits/commonHeaders"
      payload:
        oneOf:
          - $ref: "#/components/schemas/SuccessMessage"
          - $ref: "#/components/schemas/ErrorMessage"