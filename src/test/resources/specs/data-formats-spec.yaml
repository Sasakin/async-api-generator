asyncapi: 3.0.0
defaultContentType: application/json
info:
  title: Data Formats API
  version: 0.1.0
  description: API with various data formats

channels:
  validation-request:
    address: validation.request
    title: Validation request topic
    summary: Contains validation requests
    description: Topic for requests with various data formats
    servers:
      - $ref: '#/servers/dev'
    messages:
      validate:
        $ref: "#/components/messages/validate"

components:
  messageTraits:
    commonHeaders:
      headers:
        type: object
        required:
          - id
          - source
        properties:
          id:
            type: string
            description: Unique message identifier
            format: uuid
          source:
            type: string
            description: Service that sent the request
          timestamp:
            type: string
            description: Message creation timestamp
            format: date-time
        additionalProperties: false

  schemas:
    FormatTestDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID identifier
        email:
          type: string
          format: email
          description: Email address
        uri:
          type: string
          format: uri
          description: Uniform Resource Identifier
        hostname:
          type: string
          format: hostname
          description: Hostname
        ipv4:
          type: string
          format: ipv4
          description: IPv4 address
        ipv6:
          type: string
          format: ipv6
          description: IPv6 address
        uriRef:
          type: string
          format: uri-reference
          description: URI reference
        date:
          type: string
          format: date
          description: Date in YYYY-MM-DD format
        time:
          type: string
          format: time
          description: Time in HH:MM:SS format
        date-time:
          type: string
          format: date-time
          description: Date and time
        password:
          type: string
          format: password
          description: Password value
        binary:
          type: string
          format: binary
          description: Binary data
        byte:
          type: string
          format: byte
          description: Base64 encoded characters
      required:
        - id
        - email

  messages:
    validate:
      title: Validate Request
      summary: Message with validation request
      description: Message with various data formats for validation
      traits:
        - $ref: "#/components/messageTraits/commonHeaders"
      payload:
        $ref: "#/components/schemas/FormatTestDTO"